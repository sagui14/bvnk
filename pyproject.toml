[project]
name = "bvnk-api-tests"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pytest",
    "pytest-html",
    "pytest-xdist",
    "python-dotenv",
    "tenacity",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --html=reports/report.html --self-contained-html -n auto"
markers = [
    "slow: waits around a quote's 20s expiry",
    "security: authentication and tenant isolation",
    "negative: invalid input is rejected with no side effects",
    "concurrency: parallel requests against the same funds",
]
